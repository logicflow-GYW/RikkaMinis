name: Lint Probe (report only, no gate)

# WHY THIS EXISTS
# ---------------
# app/build.gradle.kts sets `lint { checkReleaseBuilds = false }` because AGP
# 8.x ships a NonNullableMutableLiveData detector that crashes
# lintVitalAnalyzeRelease (tracked at issuetracker.google.com/388538014). The
# comment there claims "debug-build lint coverage is unaffected" — but no CI
# job ever runs lint at all, so that claim has never been tested.
#
# This workflow answers two questions with ONE run and zero risk:
#   1. does `:app:lintDebug` actually run on this tree (or does the detector
#      crash there too)?
#   2. if it runs, how big is the baseline? (issue count by severity / id)
#
# It is deliberately NOT a gate: the gradle exit code is captured and printed
# but never propagated. Decide on a baseline + `abortOnError` only after the
# numbers are in. This file is a probe and is expected to be deleted or
# rewritten into a real gate once the decision is made.

on:
  workflow_dispatch:

concurrency:
  group: lint-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Lint needs the compile classpath (and KSP output), not the native
      # prebuilts: ExternalNativeBuild is disabled in this project and the
      # .so files are vendored under jniLibs, so no NDK / proot build here.
      - name: Run :app:lintDebug (report only)
        shell: bash
        run: |
          cd src/android
          set +e
          ./gradlew :app:lintDebug --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx6144m 2>&1 | tee /tmp/lint-gradle.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code"
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys, glob, xml.etree.ElementTree as ET
          from collections import Counter, defaultdict

          cands = sorted(glob.glob("src/android/app/build/reports/lint-results-*.xml"))
          cands += sorted(glob.glob("src/android/app/build/intermediates/lint*/**/*.xml", recursive=True))
          print("## Lint probe\n")
          print(f"gradle exit: {os.environ.get('GRADLE_EXIT', 'unknown')}")
          if not cands:
              print("\n**no lint XML report produced** — the task almost certainly crashed "
                    "before the report stage. See the gradle log artifact for the stack trace.")
              sys.exit(0)

          path = cands[0]
          print(f"report: `{path}`\n")
          root = ET.parse(path).getroot()
          issues = root.findall("issue")
          sev = Counter(i.get("severity") for i in issues)
          ids = Counter(i.get("id") for i in issues)
          cats = Counter()
          for i in issues:
              c = i.find("category")
              cats[(c.get("id") if c is not None else "?")] += 1

          print(f"total issues: **{len(issues)}**\n")
          print("| severity | count |")
          print("|---|---|")
          for k, v in sev.most_common():
              print(f"| {k} | {v} |")
          print("\n| category | count |")
          print("|---|---|")
          for k, v in cats.most_common():
              print(f"| {k} | {v} |")
          print("\ntop 30 issue ids:")
          print("```")
          for k, v in ids.most_common(30):
              print(f"{v:5d}  {k}")
          print("```")
          # A few representative messages per top issue id, so the decision
          # can be made without downloading the artifact.
          print("\nsamples of the 5 most frequent ids:")
          for k, _ in ids.most_common(5):
              print(f"\n**{k}**")
              shown = 0
              for i in issues:
                  if i.get("id") == k and shown < 3:
                      loc = i.find("location")
                      f = loc.get("file") if loc is not None else "?"
                      ln = loc.get("line") if loc is not None else ""
                      print(f"- `{f}:{ln}` {i.get('message')}")
                      shown += 1
          PY

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-probe-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            src/android/app/build/reports/lint-results-*.html
            src/android/app/build/reports/lint-results-*.xml
            src/android/app/build/reports/lint-results-*.txt
            /tmp/lint-gradle.log
