name: Build RikkaMinis Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/android/**'
      - 'src/shared/**'
      - 'deps/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# [audit-RC6] Serialize overlapping builds of the SAME ref. The release path
# replaces the rolling android-latest asset in place (same tag every build), so
# two concurrent `main` runs could interleave and let an OLDER (lower
# versionCode) build overwrite a NEWER one — or race each other mid-upload and
# leave android-latest pointing at a stale/failed artifact. Grouping by ref
# (here: every run of this workflow, keyed on the branch/tag being built) plus
# cancel-in-progress drops the stale one so only the newest completes.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed by the "Publish to Releases" step to create/update a GitHub Release
    # and upload the APK asset. Everything else here only reads the repo.
    permissions:
      contents: write
    steps:
      # deps/proot is a git submodule — the proot sandbox engine source. This
      # workflow builds the sandbox binary from source (see the "Build proot
      # from source" step), so the submodule must be checked out.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pre-build static scan gate: four-way sync, i18n orphan keys, bare
      # valueOf. Fails the build early on structural data-loss bugs that the
      # compiler cannot catch. Runs before JDK/SDK setup — pure Python, no
      # toolchain needed.
      - name: Run pre-build scan gate
        run: |
          python3 --version || (echo "::error::python3 is required for the scan gate" && exit 1)
          sh scripts/scan/scan.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Build the proot sandbox engine from source: deps/proot (submodule) +
      # deps/build_proot.sh + vendored deps/talloc. Needs NDK r28; the runner
      # only has the SDK so far. Pinned to 28.0.12433566 (r28-beta1) — the same
      # toolchain the upstream sandbox binary was built with.
      - name: Install NDK r28 (proot build toolchain)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.0.12433566" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Build proot from source
        run: ./deps/build_proot.sh clean

      # ExternalNativeBuild (CMake) is disabled in-build: proot is built by
      # build_proot.sh above (a W^X prebuilt), and enabling CMake would
      # overwrite it. Consequently crash_handler.cpp is NOT compiled by Gradle
      # — it ships as a VENDORED prebuilt under jniLibs. Rebuild it from source
      # so cpp changes (e.g. the Tier 0 crash-report fields) actually land in
      # the APK. Same NDK r28 toolchain as build_proot.sh.
      - name: Rebuild crash handler native lib from source
        run: ./deps/build_crash_handler.sh

      # build.gradle.kts wires `stageDebugSkillAssets` into every debug asset
      # merge. The script is `onlyIf { script.exists() }`, but it reads
      # .claude/skills/debug-server/ which is private and absent from this
      # public mirror — create it so the Exec task has an input dir.
      #
      # The Anthropic OAuth identifier prompt is private for the same reason.
      # Unit tests need only a non-empty deterministic value; they never assert
      # or ship this placeholder. Production OAuth builds must still provide the
      # real private value via app/provider-customization.properties.
      - name: Stub missing private inputs
        run: |
          mkdir -p .claude/skills/debug-server
          cat > src/android/app/provider-customization.properties <<'EOF'
          ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=CI_TEST_IDENTIFIER_PROMPT_NOT_FOR_PRODUCTION
          EOF

      # Fixed signing key, so every CI build installs OVER the previous one
      # instead of forcing an uninstall/reinstall.
      # SHA-256: FC:0C:40:0D:B7:7E:C1:81:A3:35:18:C2:E8:13:6A:AE:
      #          1A:3F:6C:79:4A:1A:A7:9F:DB:67:63:8F:C6:B1:61:13
      #
      # Do NOT write this to `~/.android/`: actions/checkout temporarily
      # overrides HOME, so `~` here is a per-run temp dir that Gradle does not
      # read back. It would silently fall back to generating a throwaway debug
      # key, and the published APK would fail to install as an upgrade.
      # Write to a fixed absolute path and point Gradle at it explicitly.
      # Restore signing keystore. [audit-RC6] SIGNING-IDENTITY RISK: the release
      # build is signed with the DEBUG keystore — alias `androiddebugkey`,
      # store/key password `android`, and the key material shipped as the
      # DEBUG_KEYSTORE_B64 secret. These are PUBLIC, well-known constants (the
      # AOSP debug key format + the debug keystore is reproducible/guessable),
      # so the resulting signature proves NOTHING about authorship: anyone can
      # rebuild and re-sign an APK with the same identity. This is a deliberate
      # trade-off so every CI build installs OVER the previous one without
      # uninstall/reinstall, at the cost of NO origin trust. It also means a
      # forged "RikkaMinis" APK signed with this same key would pass as a valid
      # upgrade. [audit-RC6] Hard gate: production releases MUST use an
      # independent, non-public release keystore (unique alias, non-trivial
      # password, held privately) rather than the debug identity. TODO
      # (separate follow-up): provision a dedicated release keystore and swap
      # buildTypes.release.signingConfig off `debug` in build.gradle.kts.
      # Until then, keep DEBUG_KEYSTORE_B64 set (gate below) and verify the APK
      # digest post-build so at least the asset is byte-deterministic.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set. Builds would get a" \
                 "random throwaway signing key and could not be installed as an upgrade."
            exit 1
          fi
          # RUNNER_TEMP, not the workspace: a keystore is a credential and must
          # never risk ending up in a commit or an uploaded artifact.
          KEYSTORE_PATH="$RUNNER_TEMP/ci-signing.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "MINIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android -alias androiddebugkey \
            | grep -E 'SHA256:|Valid from'
          # Record the expected certificate digest so the post-build check can
          # prove the APK was actually signed with THIS key. Derived from the
          # keystore rather than hardcoded, so rotating the key needs no edit.
          EXPECTED_FP=$(
            keytool -exportcert -keystore "$KEYSTORE_PATH" \
              -storepass android -alias androiddebugkey 2>/dev/null \
              | sha256sum | cut -d' ' -f1
          )
          echo "MINIS_EXPECTED_CERT_SHA256=$EXPECTED_FP" >> "$GITHUB_ENV"

      # Sanity-check the source-built sandbox binaries survived. build_proot.sh
      # (run above) writes jniLibs/arm64-v8a/libproot.so and assets/proot-aarch64;
      # a failed or truncated build surfaces here as a missing/invalid file and
      # fails the job early instead of producing a broken APK.
      - name: Verify source-built sandbox binaries
        run: |
          cd src/android/app/src/main
          test -s jniLibs/arm64-v8a/libproot.so
          # The standalone loader MUST ship alongside libproot.so. The app
          # points PROOT_LOADER at it to bypass proot's extract_loader()
          # fallback, which writes the embedded loader to an app cache dir and
          # execs it — fatal on Android because those dirs are mounted noexec
          # (dead terminal, status=1, no output). Missing loader => broken APK.
          test -s jniLibs/arm64-v8a/libproot-loader.so
          test -s assets/proot-aarch64
          test -s assets/alpine-minirootfs.tar
          echo "7f454c46" > /tmp/elf_magic
          for so in jniLibs/arm64-v8a/*.so; do
            magic=$(head -c 4 "$so" | od -A n -t x1 | tr -d ' \n')
            if [ "$magic" != "$(cat /tmp/elf_magic)" ]; then
              echo "::error::$so is not a valid ELF file (magic=$magic)"
              exit 1
            fi
          done
          ls -la jniLibs/arm64-v8a/

      # Release build (not debug): runs R8 (isMinifyEnabled = true) + resource
      # shrinking, which cuts the APK from ~39 MB to roughly the official
      # ~14 MB — a debug APK bundles every class uncompressed with no
      # tree-shaking. build.gradle.kts signs release with the `debug`
      # signingConfig, which picks up MINIS_KEYSTORE_PATH exported above, so
      # upgrade-installs keep working. Release also sets BuildConfig.DEBUG=false,
      # so the local DebugServer (127.0.0.1:5321) is compiled out entirely.
      #
      # The APK's version is CI-injected (see build.gradle.kts):
      #   - MINIS_VERSION_CODE: base 220_000_000 + workflow run number —
      #     monotonically increasing, so every published build is
      #     upgrade-installable over the previous one AND distinguishable.
      #   - MINIS_VERSION_NAME_SUFFIX: "-beta.<run>" so sideloaders can tell
      #     builds apart from the version shown in the app's About page.
      # Local builds keep the hardcoded 22 / "1.0.0".
      - name: Inject build version
        run: |
          VC=$((220000000 + GITHUB_RUN_NUMBER))
          echo "MINIS_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_NAME_SUFFIX=-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "versionCode=$VC  versionNameSuffix=-beta.$GITHUB_RUN_NUMBER"

      # JVM unit tests — the full suite. The test backlog that used to force a
      # scoped filter here is cleared:
      #   - OpenAIProviderTest: 11 failures were stale non-streaming mock
      #     contracts (sendMessage has always streamed internally); tests now
      #     speak SSE. (commit "test: align OpenAIProviderTest with the
      #     always-streaming contract")
      #   - TerminalSanitizerTest: 4 failures were real bugs — the CR fold only
      #     kept the last segment instead of proper column-overwrite semantics,
      #     and a final trim() destroyed meaningful leading/trailing whitespace
      #     (progress bars). Fixed in the implementation.
      #   - AnthropicProviderTest: 24 failures shared one root cause — the OAuth
      #     identifier prompt getter threw when BuildConfig was empty. The stub
      #     step above makes it non-empty, so they pass again.
      # If any suite is red, the build fails — no silent scoping.
      - name: Run unit tests (full suite)
        run: |
          cd src/android
          ./gradlew testReleaseUnitTest --stacktrace

      # T9 report-only perf gate — executes inside the unit suite above
      # (PerfBaselineGateTest: aggregate baseline JSONL, emit report,
      # enforce P95>15% regression only when PERF_GATE_ENFORCE=true and a
      # baseline.snapshot.json is committed). This step only surfaces the
      # verdict; the actual gating happens in the test suite. Phase 2
      # (enforced) flips on once real-device baseline data is committed —
      # see docs/stability/perf-baseline/README.md.
      - name: T9 perf gate verdict (report-only)
        run: |
          SUMMARY=src/android/app/build/reports/perf-gate/gate-summary.txt
          if [ -f "$SUMMARY" ]; then
            echo "::group::T9 perf gate"
            cat "$SUMMARY"
            echo "::endgroup::"
          else
            echo "::warning::T9 perf gate summary not found — check the unit-test step output for PerfBaselineGateTest"
          fi

      # Compile instrumented (on-device) tests — they require a real device
      # to run, so CI only validates compilation. The task assembles the
      # debug test APK (including the ui-test-manifest dependency) and
      # catches syntax/type errors in the androidTest sources.
      - name: Compile instrumented tests (compile-time gate)
        run: |
          cd src/android
          ./gradlew compileDebugAndroidTestKotlin --stacktrace

      # Force a fresh build: AGP keeps a `cache: gradle` (actions/setup-java)
      # that can restore stale native/CMake output, silently shipping an OLD
      # .so. Tier 0 caught exactly this — the crash-handler .so in the APK
      # predated the code change. clean + drop .cxx so cpp changes actually
      # get recompiled from source.
      - name: Clean native build (cpp freshness)
        run: |
          cd src/android
          ./gradlew clean --stacktrace

      - name: Build APK with Gradle
        run: |
          cd src/android
          ./gradlew assembleRelease --stacktrace

      # Prove the APK carries the fixed key. This previously regressed silently:
      # the keystore was restored correctly, but AGP never saw it and generated
      # a throwaway key instead, producing an APK that could not be installed
      # over an earlier build. Comparing certificate digests catches that class
      # of failure at build time rather than on a user's device.
      - name: Verify APK signature
        run: |
          APK=src/android/app/build/outputs/apk/release/app-release.apk
          # Parse the signing block directly rather than scraping apksigner's
          # human-readable output, whose wording varies across build-tools
          # versions — a scraper that silently yields an empty string would turn
          # this guard into a no-op.
          ACTUAL=$(python3 scripts/apk_cert_sha256.py "$APK")
          EXPECTED="$MINIS_EXPECTED_CERT_SHA256"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is NOT signed with the DEBUG_KEYSTORE_B64 key." \
                 "It would fail to install over an existing build."
            exit 1
          fi
          echo "APK signature matches the configured keystore."

      # Confirm the source-built sandbox binaries actually landed in the APK
      # and were not replaced by anything the build produced.
      - name: Verify APK contents
        run: |
          APK=src/android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'libproot\.so|proot-aarch64|alpine-minirootfs'
          EXPECTED=$(sha256sum src/android/app/src/main/jniLibs/arm64-v8a/libproot.so | cut -d' ' -f1)
          unzip -p "$APK" lib/arm64-v8a/libproot.so > /tmp/apk_libproot.so
          ACTUAL=$(sha256sum /tmp/apk_libproot.so | cut -d' ' -f1)
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::libproot.so in the APK differs from the source-built binary."
            exit 1
          fi
          echo "libproot.so matches the source-built binary."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RikkaMinis-apk
          path: |
            src/android/app/build/outputs/apk/release/app-release.apk
            src/android/app/build/tmp/golden_actual.txt
            src/android/app/build/tmp/golden_expected.txt
          if-no-files-found: error

      # Rename to a versioned, arch-tagged filename mirroring the official
      # release naming (RikkaMinis-<versionName>-arm64-v8a.apk). The filename is
      # FIXED (base version only, no -beta suffix): the rolling android-latest
      # release must keep exactly one asset, and a suffix would make the name
      # change every build, accumulating stale assets. The full per-build
      # version is reported in the release body instead.
      - name: Stage release asset
        id: stage
        run: |
          VN="1.0.0${MINIS_VERSION_NAME_SUFFIX:-}"
          VC="${MINIS_VERSION_CODE:-22}"
          OUT="RikkaMinis-arm64-v8a.apk"
          cp src/android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # Publish the APK to a rolling Release so it can be downloaded directly
      # from the repo's Releases page — same tag every build, asset replaced
      # in place, so the download link is stable.
      #
      # IMPORTANT: publishing is gated to the default branch. Without the gate
      # a `workflow_dispatch` run against a feature branch (used to validate
      # branch builds in CI) would overwrite android-latest with a test
      # build — exactly how the rolling release got polluted on 2026-08-05.
      # Feature-branch builds still surface the APK in the run's Artifacts
      # tab; only `main` may replace the official download asset.
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: "RikkaMinis Android (latest build)"
          body: |
            Automated Android build — always the newest commit on `main`.

            - Version: `${{ steps.stage.outputs.version }}` (versionCode `${{ steps.stage.outputs.versionCode }}`)
            - Commit: ${{ github.sha }}
            - ABI: arm64-v8a
            - Release build (R8-minified, signed with the fixed debug key so
              it installs over previous builds)

            Download the `.apk` below and open it on your device to install.

            ---

            ## ⚠️ 已知问题与使用边界

            **请在安装前先阅读本节。** 本构建是持续集成自动产物（滚动更新），
            不代表"修复了所有已知问题"；已知缺陷如下，工作区按可接受范围对待。

            ### 内存占用会突然飙升
            - 长时间运行 / 并发会话多 / 大附件工具调用时，内存（RSS）可能
              突然涨到数百 MB 乃至接近系统上限，属已知现象，不是死机。
            - 此时**不要继续开新会话**，先做下面任一步骤。

            ### 遇到内存飙升 / 卡顿的处理方式（按顺序）
            1. 先**杀后台**：划掉最近任务里 RikkaMinis 的卡片（或系统一键清理）。
            2. 还不行 → 打开 **设置 → 应用 → RikkaMinis → 强行停止**。
            3. 仍不恢复 → 到系统设置里**停止"后台"或"应用"相关的运行中服务**
               （或重启一次设备）。
            4. 以上都无效才考虑**卸载重装**（会丢失本地会话/配置/密钥，
               请先备份）。

            ### 版本回滚说明
            - 本页面始终跟随 `main` 最新 commit。若某次更新后对话等核心功能
              异常，可**回退到上一个已知可用的构建**（回到本页上一条 release
              记录下载），并参考上面的"强行停止"步骤先清理残留状态。

            ### 边界情况
            - 覆盖安装（不卸载直接装新版）可能保留旧数据，个别版本存在残留
              状态导致功能异常；遇到异常建议优先"强行停止"而非重装。
            - 此构建使用 debug 签名密钥（公开常量），任何人可重签同名 APK，
              请**只从本仓库 Releases 页下载**。
          files: ${{ steps.stage.outputs.asset }}
          prerelease: true
          make_latest: "true"
