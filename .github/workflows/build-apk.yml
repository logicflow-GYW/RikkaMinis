name: Build RikkaMinis Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/android/**'
      - 'src/shared/**'
      - 'deps/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      # PROBE-ONLY (branch ci/lint-probe-1113). AGP lint has never run in this
      # repo: build.gradle.kts sets `checkReleaseBuilds = false` because a
      # NonNullableMutableLiveData detector crashes lintVitalAnalyzeRelease,
      # and the comment claims debug lint is unaffected — untested.
      # true → run ONLY the lint job (skips gates/tests/build/publish);
      # false/absent → today's behavior, byte for byte.
      lint_probe:
        description: 'Run :app:lintDebug only (report, no gate)'
        type: boolean
        default: false

# [audit-RC6] Serialize overlapping builds of the SAME ref. The release path
# replaces the rolling android-latest asset in place (same tag every build), so
# two concurrent `main` runs could interleave and let an OLDER (lower
# versionCode) build overwrite a NEWER one — or race each other mid-upload and
# leave android-latest pointing at a stale/failed artifact. Grouping by ref
# (here: every run of this workflow, keyed on the branch/tag being built) plus
# cancel-in-progress drops the stale one so only the newest completes.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # job 1/4 — static gates. Pure Python, no toolchain (~60s measured).
  #
  # [ci/speed] This used to be the first step of the single build job, which
  # bought "a gate failure costs ~3 minutes, not ~12". That ordering is given
  # up here on purpose: the 115 gates have been green run after run, so the
  # common case paid their full 178s as pure latency in front of everything
  # else. In the job split they run BESIDE the two heavy jobs instead.
  # If gate failures ever become frequent again, the revert is: fold this job
  # back to the head of build-apk's steps.
  # ────────────────────────────────────────────────────────────────────────
  scan-gate:
    # PROBE-ONLY guard: see the lint_probe input at the top of this file.
    if: ${{ inputs.lint_probe != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pre-build static scan gate: four-way sync, i18n orphan keys, bare
      # valueOf. Fails the build early on structural data-loss bugs that the
      # compiler cannot catch. Pure Python — this job needs no toolchain, which
      # is why it is the cheapest of the four and always finishes first.
      - name: Run pre-build scan gate
        run: |
          python3 --version || (echo "::error::python3 is required for the scan gate" && exit 1)
          sh scripts/scan/scan.sh

          # Scanner self-test — same fixture ground truth as scan-gate.yml:
          # assert the scanners still catch what they claim to catch before
          # this build stamps its artifacts green.
          #
          # [ci/speed] Measured on run 41367085524: this step is 182s, of which
          # 121s is test_scan.py and 63s is the 115 gates. The fixtures only
          # re-prove the SCANNERS; a scanner can lose teeth only if
          # scripts/scan/** moved in this push, and on every other push the
          # gates above have already run over this exact tree. So: run the
          # fixtures when the scanners changed, skip otherwise.
          #
          # Fail OPEN — if the base commit cannot be resolved for any reason
          # (workflow_dispatch, force-push, gc'd object, surprise API shape) we
          # run the fixtures. "Self-test silently skipped" must never be the
          # reason a toothless scanner ships.
          #
          # Base resolution order: push event → github.event.before (authoritative
          # push range); anything else (workflow_dispatch, branch builds) →
          # origin/main, i.e. "did this branch touch the scanners?". Both
          # missing → run the fixtures.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ]; then
            git fetch --depth=1 --no-tags origin +main:refs/remotes/origin/main >/dev/null 2>&1 || true
            BASE="$(git rev-parse --verify -q 'refs/remotes/origin/main^{commit}' || true)"
          fi
          if [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --depth=1 --no-tags origin "$BASE" >/dev/null 2>&1 || true
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::base commit not resolvable — running the fixture self-test unconditionally"
            python3 scripts/scan/test_scan.py --jobs 4
            exit 0
          fi
          echo "scan-gate base=$BASE head=${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}" -- scripts/scan 2>&1)" || CHANGED="GIT_DIFF_FAILED"
          if [ "$CHANGED" = "GIT_DIFF_FAILED" ] || [ -n "$CHANGED" ]; then
            echo "::notice::scanners moved in this push (or the diff was unreadable) — running the fixture self-test"
            printf '%s\n' "$CHANGED"
            python3 scripts/scan/test_scan.py --jobs 4
          else
            echo "::notice::scripts/scan/** untouched in this push — skipping the fixture self-test (~121s); scan.sh ran all 115 gates over this tree"
          fi

  # ────────────────────────────────────────────────────────────────────────
  # job 2/4 — JVM unit tests + instrumented-test compilation.
  #
  # No NDK here, and that is a measured claim: `testReleaseUnitTest` never
  # traverses mergeReleaseNativeLibs (in the step log of run 41367085524 that
  # task appears only under assembleRelease), so the 27s NDK install and the
  # three native builds belong to job 3 alone.
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    # PROBE-ONLY guard: see the lint_probe input at the top of this file.
    if: ${{ inputs.lint_probe != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # [T-ci-sdk-tools-deprecation] The action's default is
          # `tools platform-tools`, but Google stopped serving the deprecated
          # `tools` package on 2026-09-15 — sdkmanager now exits with
          # "Warning: Failed to find package 'tools'" (measured: CI run #1532,
          # 2026-09-15; upstream issue android-actions/setup-android#537).
          # We never needed `tools`; request only what the build uses.
          packages: 'platform-tools'

      # build.gradle.kts wires `stageDebugSkillAssets` into every debug asset
      # merge. The script is `onlyIf { script.exists() }`, but it reads
      # .claude/skills/debug-server/ which is private and absent from this
      # public mirror — create it so the Exec task has an input dir.
      #
      # The Anthropic OAuth identifier prompt is private for the same reason.
      # Unit tests need only a non-empty deterministic value; they never assert
      # or ship this placeholder. Production OAuth builds must still provide the
      # real private value via app/provider-customization.properties.
      #
      # [ci/speed] Duplicated verbatim in the build-apk job — jobs do not share
      # a workspace and this is five lines. A composite action would hide which
      # job needs what; keep the two copies in sync instead (same reason the
      # scan gate treats duplicated statements as debt).
      - name: Stub missing private inputs
        run: |
          mkdir -p .claude/skills/debug-server
          cat > src/android/app/provider-customization.properties <<'EOF'
          ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=CI_TEST_IDENTIFIER_PROMPT_NOT_FOR_PRODUCTION
          EOF

      # JVM unit tests — the full suite. The test backlog that used to force a
      # scoped filter here is cleared:
      #   - OpenAIProviderTest: 11 failures were stale non-streaming mock
      #     contracts (sendMessage has always streamed internally); tests now
      #     speak SSE. (commit "test: align OpenAIProviderTest with the
      #     always-streaming contract")
      #   - TerminalSanitizerTest: 4 failures were real bugs — the CR fold only
      #     kept the last segment instead of proper column-overwrite semantics,
      #     and a final trim() destroyed meaningful leading/trailing whitespace
      #     (progress bars). Fixed in the implementation.
      #   - AnthropicProviderTest: 24 failures shared one root cause — the OAuth
      #     identifier prompt getter threw when BuildConfig was empty. The stub
      #     step above makes it non-empty, so they pass again.
      # If any suite is red, the build fails — no silent scoping.
      - name: Run unit tests (full suite)
        run: |
          cd src/android
          ./gradlew testReleaseUnitTest --stacktrace

      # Compile instrumented (on-device) tests — they require a real device
      # to run, so CI only validates compilation. The task assembles the
      # debug test APK (including the ui-test-manifest dependency) and
      # catches syntax/type errors in the androidTest sources.
      - name: Compile instrumented tests (compile-time gate)
        run: |
          cd src/android
          ./gradlew compileDebugAndroidTestKotlin --stacktrace

  # ────────────────────────────────────────────────────────────────────────
  # job 3/4 — release APK: native builds, R8, signing, post-build verification.
  #
  # This is the only job that needs the deps/proot submodule, the NDK and the
  # signing secrets, so it is also the only job granted nothing but read (the
  # write token lives in job 4).
  # ────────────────────────────────────────────────────────────────────────
  build-apk:
    # PROBE-ONLY guard: see the lint_probe input at the top of this file.
    if: ${{ inputs.lint_probe != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # deps/proot is a git submodule — the proot sandbox engine source. This
      # workflow builds the sandbox binary from source (see the "Build proot
      # from source" step below), so the submodule must be checked out.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # [T-ci-sdk-tools-deprecation] The action's default is
          # `tools platform-tools`, but Google stopped serving the deprecated
          # `tools` package on 2026-09-15 — sdkmanager now exits with
          # "Warning: Failed to find package 'tools'" (measured: CI run #1532,
          # 2026-09-15; upstream issue android-actions/setup-android#537).
          # We never needed `tools`; request only what the build uses.
          packages: 'platform-tools'

      # Build the proot sandbox engine from source: deps/proot (submodule) +
      # deps/build_proot.sh + vendored deps/talloc. Needs NDK r28; the runner
      # only has the SDK so far. Pinned to 28.0.12433566 (r28-beta1) — the same
      # toolchain the upstream sandbox binary was built with.
      - name: Install NDK r28 (proot build toolchain)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.0.12433566" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Build proot from source
        run: ./deps/build_proot.sh clean

      # ExternalNativeBuild (CMake) is disabled in-build: proot is built by
      # build_proot.sh above (a W^X prebuilt), and enabling CMake would
      # overwrite it. Consequently crash_handler.cpp is NOT compiled by Gradle
      # — it ships as a VENDORED prebuilt under jniLibs. Rebuild it from source
      # so cpp changes (e.g. the Tier 0 crash-report fields) actually land in
      # the APK. Same NDK r28 toolchain as build_proot.sh.
      - name: Rebuild crash handler native lib from source
        run: ./deps/build_crash_handler.sh

      # Same reasoning as crash_handler above, plus a package-rename constraint:
      # JNI symbol names are derived from the Kotlin host class's fully
      # qualified name. The vendored libjieba_jni.so carried
      # Java_com_openminis_app_shared_JiebaEngine_*; after the package rename
      # the Kotlin side looks for Java_com_rikkaminis_app_*, so the binary MUST
      # be rebuilt from cpp/jieba_jni.cpp or the first Chinese-segmentation
      # call throws UnsatisfiedLinkError.
      - name: Rebuild jieba native lib from source
        run: ./deps/build_jieba.sh

      # Hard gate: the vendored/ rebuilt .so symbols must match the Kotlin
      # package. Catches a stale binary after any future package rename or
      # upstream fusion that brings back the old name.
      - name: Verify JNI symbols match package
        run: |
          cd src/android/app/src/main/jniLibs/arm64-v8a
          fail=0
          for so in libjieba_jni.so libminis_crash_handler.so; do
            if ! strings "$so" | grep -q "Java_com_rikkaminis_app_"; then
              echo "::error::$so has no Java_com_rikkaminis_app_* symbols (stale binary?)"
              fail=1
            fi
            if strings "$so" | grep -q "Java_com_openminis_app_"; then
              echo "::error::$so still exports Java_com_openminis_app_* symbols"
              fail=1
            fi
            echo "$so: $(strings "$so" | grep -c 'Java_com_rikkaminis_app_') new symbols"
          done
          exit $fail

      # build.gradle.kts wires `stageDebugSkillAssets` into every debug asset
      # merge. The script is `onlyIf { script.exists() }`, but it reads
      # .claude/skills/debug-server/ which is private and absent from this
      # public mirror — create it so the Exec task has an input dir.
      #
      # The Anthropic OAuth identifier prompt is private for the same reason.
      # Unit tests need only a non-empty deterministic value; they never assert
      # or ship this placeholder. Production OAuth builds must still provide the
      # real private value via app/provider-customization.properties.
      - name: Stub missing private inputs
        run: |
          mkdir -p .claude/skills/debug-server
          cat > src/android/app/provider-customization.properties <<'EOF'
          ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=CI_TEST_IDENTIFIER_PROMPT_NOT_FOR_PRODUCTION
          EOF

      # [signing-rotate 2026-10-27] Release signing identity.
      # The keystore is a private credential and lives ONLY in repository
      # secrets — never in the repo (see backlog §43-11). Restore it to
      # RUNNER_TEMP so it cannot leak into the workspace or an artifact.
      # Do NOT write it to `~/.android/`: actions/checkout temporarily
      # overrides HOME, so `~` is a per-run temp dir Gradle does not read back;
      # AGP would silently generate a throwaway debug key and the published
      # APK would fail to install as an upgrade.
      - name: Restore release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete (RELEASE_KEYSTORE_B64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD). Refusing to build: the release APK would otherwise fall back to the debug identity."
            exit 1
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/release-signing.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "MINIS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "MINIS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MINIS_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MINIS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'Alias name|SHA256:|Valid from'
          # Expected certificate digest, derived from the keystore so rotating
          # the key needs no edit here. The post-build step compares the APK's
          # signer digest against it.
          EXPECTED_FP=$(
            keytool -exportcert -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
              | sha256sum | cut -d' ' -f1
          )
          echo "MINIS_EXPECTED_CERT_SHA256=$EXPECTED_FP" >> "$GITHUB_ENV"

      # Sanity-check the source-built sandbox binaries survived. build_proot.sh
      # (run above) writes jniLibs/arm64-v8a/libproot.so and assets/proot-aarch64;
      # a failed or truncated build surfaces here as a missing/invalid file and
      # fails the job early instead of producing a broken APK.
      - name: Verify source-built sandbox binaries
        run: |
          cd src/android/app/src/main
          test -s jniLibs/arm64-v8a/libproot.so
          # The standalone loader MUST ship alongside libproot.so. The app
          # points PROOT_LOADER at it to bypass proot's extract_loader()
          # fallback, which writes the embedded loader to an app cache dir and
          # execs it — fatal on Android because those dirs are mounted noexec
          # (dead terminal, status=1, no output). Missing loader => broken APK.
          test -s jniLibs/arm64-v8a/libproot-loader.so
          test -s assets/proot-aarch64
          test -s assets/alpine-minirootfs.tar
          echo "7f454c46" > /tmp/elf_magic
          for so in jniLibs/arm64-v8a/*.so; do
            magic=$(head -c 4 "$so" | od -A n -t x1 | tr -d ' \n')
            if [ "$magic" != "$(cat /tmp/elf_magic)" ]; then
              echo "::error::$so is not a valid ELF file (magic=$magic)"
              exit 1
            fi
          done
          ls -la jniLibs/arm64-v8a/

      # Release build (not debug): runs R8 (isMinifyEnabled = true) + resource
      # shrinking, which cuts the APK from ~39 MB to roughly the official
      # ~14 MB — a debug APK bundles every class uncompressed with no
      # tree-shaking. build.gradle.kts signs release with the `debug`
      # signingConfig, which picks up MINIS_KEYSTORE_PATH exported above, so
      # upgrade-installs keep working. Release also sets BuildConfig.DEBUG=false,
      # so the local DebugServer (127.0.0.1:5321) is compiled out entirely.
      #
      # The APK's version is CI-injected (see build.gradle.kts):
      #   - MINIS_VERSION_CODE: base 220_000_000 + workflow run number —
      #     monotonically increasing, so every published build is
      #     upgrade-installable over the previous one AND distinguishable.
      #   - MINIS_VERSION_NAME_SUFFIX: "+<run>" (build metadata). 1.0.0 is the
      #     stable release line, so the per-build number must NOT be a
      #     prerelease identifier — "-beta.<run>" made every published build a
      #     prerelease version, which semver ranks BELOW the plain release and
      #     which used to sort above it in our own comparator. Build metadata
      #     is ignored by version precedence, so sideloaders can still tell
      #     builds apart from the About page while the version stays 1.0.0.
      # Local builds keep the hardcoded 22 / "1.0.0".
      - name: Inject build version
        run: |
          VC=$((220000000 + GITHUB_RUN_NUMBER))
          echo "MINIS_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_NAME_SUFFIX=+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "versionCode=$VC  versionNameSuffix=+$GITHUB_RUN_NUMBER"

      # JVM unit tests — the full suite. The test backlog that used to force a
      # scoped filter here is cleared:
      #   - OpenAIProviderTest: 11 failures were stale non-streaming mock
      #     contracts (sendMessage has always streamed internally); tests now
      #     speak SSE. (commit "test: align OpenAIProviderTest with the
      #     always-streaming contract")
      #   - TerminalSanitizerTest: 4 failures were real bugs — the CR fold only
      #     kept the last segment instead of proper column-overwrite semantics,
      #     and a final trim() destroyed meaningful leading/trailing whitespace
      #     (progress bars). Fixed in the implementation.
      #   - AnthropicProviderTest: 24 failures shared one root cause — the OAuth
      #     identifier prompt getter threw when BuildConfig was empty. The stub
      #     step above makes it non-empty, so they pass again.
      # Force a fresh build: AGP keeps a `cache: gradle` (actions/setup-java)
      # that can restore stale native/CMake output, silently shipping an OLD
      # .so. Tier 0 caught exactly this — the crash-handler .so in the APK
      # predated the code change. clean so cpp changes actually get recompiled
      # from source.
      #
      # [ci/speed] On a fresh hosted runner there is no build/ dir at all, so
      # today this is a ~7s no-op. It stays because it is the single thing
      # standing between a future build-dir cache and a silently stale .so —
      # seven seconds to keep a guard that already caught a real regression.
      - name: Clean native build (cpp freshness)
        run: |
          cd src/android
          ./gradlew clean --stacktrace
      - name: Build APK with Gradle
        run: |
          cd src/android
          ./gradlew assembleRelease --stacktrace

      # Prove the APK carries the fixed key. This previously regressed silently:
      # the keystore was restored correctly, but AGP never saw it and generated
      # a throwaway key instead, producing an APK that could not be installed
      # over an earlier build. Comparing certificate digests catches that class
      # of failure at build time rather than on a user's device.
      - name: Verify APK signature
        run: |
          APK=src/android/app/build/outputs/apk/release/app-release.apk
          # Parse the signing block directly rather than scraping apksigner's
          # human-readable output, whose wording varies across build-tools
          # versions — a scraper that silently yields an empty string would turn
          # this guard into a no-op.
          ACTUAL=$(python3 scripts/apk_cert_sha256.py "$APK")
          EXPECTED="$MINIS_EXPECTED_CERT_SHA256"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is NOT signed with the configured release keystore." \
                 "It would fail to install over an existing build."
            exit 1
          fi
          echo "APK signature matches the configured keystore."

      # Confirm the source-built sandbox binaries actually landed in the APK
      # and were not replaced by anything the build produced.
      - name: Verify APK contents
        run: |
          APK=src/android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'libproot\.so|proot-aarch64|alpine-minirootfs'
          EXPECTED=$(sha256sum src/android/app/src/main/jniLibs/arm64-v8a/libproot.so | cut -d' ' -f1)
          unzip -p "$APK" lib/arm64-v8a/libproot.so > /tmp/apk_libproot.so
          ACTUAL=$(sha256sum /tmp/apk_libproot.so | cut -d' ' -f1)
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::libproot.so in the APK differs from the source-built binary."
            exit 1
          fi
          echo "libproot.so matches the source-built binary."

          # Debug-code release hygiene: debug/ lives in src/main, so the APK
          # must NOT contain any debug-only marker string. This is the exact
          # property that matters — a -keep rule, a minify disable, or a new
          # BuildConfig.DEBUG-less entry point would ship the token-free
          # loopback debug JSON-RPC (127.0.0.1:5321) to users with no other
          # gate noticing. Verified on the BUILT artifact, not the source.
          python3 scripts/scan/debug_leak_guard.py apk "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RikkaMinis-apk
          path: src/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  # PROBE job (branch ci/lint-probe-1113 only — NOT a gate, NOT for main).
  #
  # `lint { checkReleaseBuilds = false }` in app/build.gradle.kts exists
  # because AGP 8.x's NonNullableMutableLiveData detector throws
  # IncompatibleClassChangeError inside lintVitalAnalyzeRelease. That switch
  # only kills the VITAL path; the ordinary `lintDebug` task is a different
  # task graph and is (per the same comment) unaffected — but no CI job has
  # ever run it, so nobody knows. This job finds out, once, cheaply.
  #
  # It never fails the run: the gradle exit code is printed and exported,
  # the XML report is summarized into the step summary, artifacts uploaded.
  # Decision (baseline + abortOnError, or drop the idea) comes AFTER.
  # ────────────────────────────────────────────────────────────────────────
  lint-probe:
    if: ${{ inputs.lint_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ROUND 3. What rounds 1-2 established (runs 43406670614, 43408220558):
      #
      #  * plain `:app:lintDebug` crashes exactly like lintVital did — three
      #    analyze tasks abort with IncompatibleClassChangeError. So the
      #    build.gradle.kts comment "debug-build lint coverage is unaffected"
      #    is FALSE; nothing has ever run lint here.
      #  * `disable += "NonNullableMutableLiveData"` does not help: the trace
      #    shows that detector still executing, so the crash precedes the
      #    disable list.
      #  * `-Pandroid.lint.useK2Uast=false` does not help (same ICCE).
      #  * `-Pandroid.experimental.lint.version=31.9.0` was MY misreading: AGP
      #    adds 23 to the major, so it resolved lint-gradle:54.9.0 and died on
      #    "Could not find". The property wants an AGP-style version — 8.9.0
      #    means lint 31.9.0.
      #
      # So round 3 does two things: audit WHICH jars carry the crashing class
      # (the ICCE signature is a duplicate-class/mixed-version load), and try
      # the lint override with correct version numbering.
      - name: Audit which lint jars carry the crashing detector
        shell: bash
        run: |
          cd src/android
          # Populate the dependency cache without a full compile.
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath -q \
            > /tmp/deps-debug.txt 2>&1 || true
          python3 - <<'PY' | tee /tmp/classpath-audit.txt
          import glob, hashlib, os, zipfile, io
          TARGET = "androidx/compose/runtime/lint/RememberInCompositionDetectorKt.class"
          roots = [os.path.expanduser("~/.gradle/caches/modules-2/files-2.1")]
          jars = []
          for root in roots:
              for pat in ("**/*.aar", "**/*.jar"):
                  jars.extend(glob.glob(os.path.join(root, pat), recursive=True))
          print(f"scanning {len(jars)} artifacts in the gradle cache")
          hits = []
          for path in jars:
              try:
                  if path.endswith(".aar"):
                      with zipfile.ZipFile(path) as aar:
                          if "lint.jar" not in aar.namelist():
                              continue
                          data = aar.read("lint.jar")
                      with zipfile.ZipFile(io.BytesIO(data)) as lj:
                          if TARGET not in lj.namelist():
                              continue
                          digest = hashlib.sha256(lj.read(TARGET)).hexdigest()[:16]
                          hits.append((path, "lint.jar", digest))
                  else:
                      with zipfile.ZipFile(path) as j:
                          if TARGET not in j.namelist():
                              continue
                          digest = hashlib.sha256(j.read(TARGET)).hexdigest()[:16]
                          hits.append((path, "jar", digest))
              except Exception:
                  continue
          print(f"\nartifacts carrying {TARGET}: {len(hits)}")
          for path, kind, digest in hits:
              # Trim the sha1 path segment so the line stays readable.
              parts = path.split(os.sep)
              label = "/".join(parts[-4:-1]) if len(parts) > 4 else path
              print(f"  {digest}  {kind:9s} {label}")
          print(f"\ndistinct byte-copies: {len({h[2] for h in hits})}")
          PY

      - name: Probe lint configurations
        shell: bash
        run: |
          cd src/android
          set +e
          : > /tmp/probe-summary.txt
          attempt() {
            name="$1"; shift
            echo "===== ATTEMPT: $name =====" | tee -a /tmp/probe-summary.txt
            echo "flags: $*" | tee -a /tmp/probe-summary.txt
            rm -rf app/build/intermediates/lint* app/build/reports/lint-results-* 2>/dev/null
            ./gradlew :app:lintDebug --stacktrace "$@" \
              -Dorg.gradle.jvmargs=-Xmx6144m > "/tmp/lint-$name.log" 2>&1
            code=$?
            if ls app/build/reports/lint-results-*.xml >/dev/null 2>&1; then
              mkdir -p "/tmp/report-$name"
              cp app/build/reports/lint-results-* "/tmp/report-$name/" 2>/dev/null
              echo "exit=$code REPORT=YES" | tee -a /tmp/probe-summary.txt
              return 0
            fi
            echo "exit=$code REPORT=no" | tee -a /tmp/probe-summary.txt
            grep -m1 -oE "IncompatibleClassChangeError:[A-Za-z]*|NoSuchMethodError:[A-Za-z]*|Could not find [^ ]+|UnsupportedClassVersionError" \
              "/tmp/lint-$name.log" | tee -a /tmp/probe-summary.txt
            return 1
          }

          # AGP-style version numbers (AGP 8.N.P ↔ lint 31.N.P).
          attempt lint-8.9.0   -Pandroid.experimental.lint.version=8.9.0 && exit 0
          attempt lint-8.13.2  -Pandroid.experimental.lint.version=8.13.2 && exit 0
          attempt k2off-8.13.2 -Pandroid.lint.useK2Uast=false -Pandroid.experimental.lint.version=8.13.2 && exit 0
          exit 0

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys, glob, xml.etree.ElementTree as ET
          from collections import Counter

          print("## Lint probe\n")
          if os.path.exists("/tmp/classpath-audit.txt"):
              print("### which jars carry the crashing detector\n")
              print("```")
              print(open("/tmp/classpath-audit.txt").read().strip())
              print("```\n")
          if os.path.exists("/tmp/probe-summary.txt"):
              print("### attempts\n")
              print("```")
              print(open("/tmp/probe-summary.txt").read().strip())
              print("```\n")

          cands = sorted(glob.glob("/tmp/report-*/*.xml"))
          if not cands:
              print("\n**no configuration produced a lint XML report.** "
                    "Read the `lint-<attempt>.log` files in the artifact.")
              sys.exit(0)

          path = cands[0]
          print(f"winning config report: `{path}`\n")
          root = ET.parse(path).getroot()
          issues = root.findall("issue")
          sev = Counter(i.get("severity") for i in issues)
          ids = Counter(i.get("id") for i in issues)
          cats = Counter()
          for i in issues:
              c = i.find("category")
              cats[c.get("id") if c is not None else "?"] += 1
          print(f"total issues: **{len(issues)}**\n")
          print("| severity | count |\n|---|---|")
          for k, v in sev.most_common():
              print(f"| {k} | {v} |")
          print("\n| category | count |\n|---|---|")
          for k, v in cats.most_common():
              print(f"| {k} | {v} |")
          print("\ntop 30 issue ids:\n```")
          for k, v in ids.most_common(30):
              print(f"{v:5d}  {k}")
          print("```\n\nsamples of the 5 most frequent ids:")
          for k, _ in ids.most_common(5):
              print(f"\n**{k}**")
              shown = 0
              for i in issues:
                  if i.get("id") == k and shown < 3:
                      loc = i.find("location")
                      f = loc.get("file") if loc is not None else "?"
                      ln = loc.get("line") if loc is not None else ""
                      print(f"- `{f}:{ln}` {i.get('message')}")
                      shown += 1
          PY

      - name: Upload lint reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-probe-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/probe-summary.txt
            /tmp/classpath-audit.txt
            /tmp/deps-debug.txt
            /tmp/lint-*.log
            /tmp/report-*/*

  # ────────────────────────────────────────────────────────────────────────
  # job 4/4 — publish.
  #
  # `needs:` is the fail-fast: any of the three failing skips this job, so a
  # red run can never publish. Note what GitHub does NOT do — a failing job
  # does not cancel its still-running siblings (fail-fast exists only for
  # matrix jobs), so the run turns red the moment the failing job fails while
  # the others finish their remaining minutes. The publish gate is what makes
  # that harmless: no artifact, no tag, no release.
  #
  # This is the only job with a write token — contents: write is what moving
  # the rolling tag and replacing the release asset need.
  # ────────────────────────────────────────────────────────────────────────
  publish:
    needs: [scan-gate, unit-tests, build-apk]
    # PROBE-ONLY guard: see the lint_probe input at the top of this file.
    if: ${{ inputs.lint_probe != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Needed for the `git push -f` of the rolling tag below; no submodules.
      - name: Checkout Code
        uses: actions/checkout@v7

      # The APK crosses the job boundary as an artifact (14.7 MB, ~2s each way).
      - name: Download APK Artifact
        uses: actions/download-artifact@v7
        with:
          name: RikkaMinis-apk
          path: dist

      # Recomputed rather than passed between jobs: it is one arithmetic line
      # off the run number, and the build job already stamped these values into
      # the APK itself — this copy only feeds the release title/body.
      - name: Inject build version
        run: |
          VC=$((220000000 + GITHUB_RUN_NUMBER))
          echo "MINIS_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_NAME_SUFFIX=+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "versionCode=$VC  versionNameSuffix=+$GITHUB_RUN_NUMBER"

      # Rename to a versioned, arch-tagged filename mirroring the official
      # release naming (RikkaMinis-<versionName>-arm64-v8a.apk). The filename is
      # FIXED (base version only, no -beta suffix): the rolling android-latest
      # release must keep exactly one asset, and a suffix would make the name
      # change every build, accumulating stale assets. The full per-build
      # version is reported in the release body instead.
      - name: Stage release asset
        id: stage
        run: |
          # Keep the base version in sync with build.gradle.kts versionName
          # (both are the stable 1.0.0 line; CI appends +<run> build metadata).
          VN="1.0.0${MINIS_VERSION_NAME_SUFFIX:-}"
          VC="${MINIS_VERSION_CODE:-22}"
          OUT="RikkaMinis-arm64-v8a.apk"
          cp dist/app-release.apk "$OUT"
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # Publish the APK to a rolling Release so it can be downloaded directly
      # from the repo's Releases page — same tag every build, asset replaced
      # in place, so the download link is stable.
      #
      # IMPORTANT: publishing is gated to the default branch. Without the gate
      # a `workflow_dispatch` run against a feature branch (used to validate
      # branch builds in CI) would overwrite android-latest with a test
      # build — exactly how the rolling release got polluted on 2026-08-05.
      # Feature-branch builds still surface the APK in the run's Artifacts
      # tab; only `main` may replace the official download asset.
      # The rolling release only swaps its APK asset and title in place — the
      # TAG never moved. Measured 2026-10-27: `android-latest` was still pinned
      # at 91498d74 (2026-09-01) while the release page advertised v1.0.0+2766,
      # so the "Source code" link under that tag served a months-old tree that
      # has nothing to do with the APK next to it. Move the ref BEFORE the
      # publish step so the release the user sees and the commit its tag points
      # at are always the same thing. (Force is required: the whole point is
      # that this tag is a moving pointer, unlike versioned tags.)
      - name: Move the rolling tag android-latest to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f android-latest "${GITHUB_SHA}"
          git push -f origin "refs/tags/android-latest"

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: android-latest
          name: "RikkaMinis Android v${{ steps.stage.outputs.version }}"
          body: |
            Automated Android build — always the newest commit on `main`.

            - Version: `${{ steps.stage.outputs.version }}` (versionCode `${{ steps.stage.outputs.versionCode }}`)
            - Commit: ${{ github.sha }}
            - ABI: arm64-v8a
            - Release build (R8-minified, signed with this repository's private
              release key; the keystore lives only in CI secrets, never in the
              tree, so it installs over previous builds)

            Download the `.apk` below and open it on your device to install.

            ---

            ## 📝 说明

            - 本版是 `main` 的正式发布（滚动更新：每次 `main` 构建覆盖同一
              release，版本号保持 1.0.0，构建号见 Version 一栏）。应用目前
              运行稳定，无需特别的维护操作。
            - 若个别设备上遇到异常，先"强行停止"应用再重开即可，一般无需
              卸载重装（卸载会丢失本地会话/配置/密钥，操作前请先备份）。
            - 若某次更新后核心功能异常，可回退到本页上一条 release 记录下载
              的旧构建。
            - 本构建使用本仓库私有的 release 签名密钥（密钥只存在于 CI
              secrets，不在源码树中），可覆盖升级此前由同一密钥签名的构建。
              2026-10-27 之前的旧构建用的是公开的 AOSP debug 密钥，任何人
              都能伪造同名 APK——若你装的还是那时的包，请**只从本仓库
              Releases 页下载**，并在首次覆盖升级前先卸载旧包。
          files: ${{ steps.stage.outputs.asset }}
          prerelease: false
          make_latest: "true"
