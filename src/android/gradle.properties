org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
# [ci/heap 2026-11-24] 6144m, up from 2048m.
#
# WHY: `:app:minifyReleaseWithR8` is 60-67% of the build-apk job and had grown
# to 575-731s, and run 3498 finally died on it outright:
#   ERROR: R8: java.lang.OutOfMemoryError: Java heap space
# at the old 2 GiB ceiling on a 4-core/16GB runner. Slow and crashed were the
# same curve: too small a heap for this input shows up as GC churn first.
#
# MEASURED (same tree, same runner model Xeon 6975P-C, dispatch-only heap
# override on branch ci/r8-probe-1124):
#   2048m -> R8 571s, build step 12m45s
#   4096m -> R8 434s, build step  9m58s
#   6144m -> R8 390s, build step  9m19s
# Gains flatten after 4g (+137s for the first +2g, +44s for the second), so 6g
# is where it stops paying. An 8g run landed on a different runner model (AMD
# EPYC 7763) and took 484s, which is not comparable — hence the runner CPU
# fingerprint step added to build-apk.yml.
#
# The previous 4g -> 2g revert (commit 15aada73b) measured 4m41s at 4g vs
# 4m21s/3m35s at 2g and concluded the heap did not matter. That was the older
# runner tier with an R8 task of 3m35-4m21; at today's 9-12 minute R8 the same
# setting is the difference between finishing and OOM. Do not revert this
# without re-running the A/B on the current runner tier.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
