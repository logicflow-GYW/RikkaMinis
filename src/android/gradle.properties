# [ci/speed] 4g, up from 2g. Measured on run 41367085524: `minifyReleaseWithR8`
# is a single 239s task — 26% of the whole build, on a 4-core/16GB hosted
# runner. R8 is memory-hungry and single-task; at 2g the daemon spends a
# visible share of that time in GC instead of shrinking. Nothing else in the
# sandbox is competing for RAM (Kotlin runs in its own daemon process).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
